[package]
name = "qml-diagnostic"
version = "0.1.0"
edition = "2024"
publish = false

[features]
gstreamer = ["dep:music-library-gstreamer"]

[dependencies]
music-library-musicbrainz = { path = "../../adapters/musicbrainz" }
music-library-spotify = { path = "../../adapters/spotify" }
music-library-gstreamer = { path = "../../adapters/gstreamer", optional = true }
music-library = { path = "../.." }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
url = "2"
httpdate = "1"
qmetaobject = "0.2.10"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"

[dev-dependencies]
lofty = "0.25"
